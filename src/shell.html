<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">

<title>筑造之间 · 微缩工地沙盘</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:#262b30;color:#eee9df;font-family:Inter,"Segoe UI","Microsoft YaHei",sans-serif}button{font:inherit}#scene{position:absolute;inset:0;width:100%;height:100%;outline:0;touch-action:none}canvas{display:block}.vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 48%,transparent 48%,#12191c35 100%)}header{position:absolute;left:38px;top:30px;pointer-events:none}.eyebrow{display:flex;align-items:center;gap:10px;font-size:10px;letter-spacing:3px;color:#ceb780;font-weight:600}.mark{height:18px;width:18px;display:inline-block;border:1px solid #cbb376;transform:rotate(30deg);position:relative}.mark:after{content:"";position:absolute;inset:4px;border:1px solid #cbb376}h1{font-weight:500;font-size:34px;letter-spacing:7px;margin:14px 0 9px;text-shadow:0 2px 10px #0005}.subtitle{color:#b8bdbb;font-size:11px;letter-spacing:2.2px}.topright{position:absolute;right:34px;top:30px;display:flex;align-items:center;gap:10px}.glass{background:linear-gradient(145deg,#fbf9ef18,#e9edec08);backdrop-filter:blur(18px);border:1px solid #f4f0df22;box-shadow:0 8px 24px #0001;border-radius:10px}.clock{padding:10px 17px;display:flex;align-items:center;gap:13px}.sunicon{color:#edc268;font-size:21px}#time{font-size:17px;letter-spacing:1px;font-variant-numeric:tabular-nums}.phase{font-size:10px;letter-spacing:1px;color:#c2c9c8;margin-top:2px}.iconbtn{cursor:pointer;color:#dddcd4;background:#ffffff0b;border:1px solid #ffffff22;border-radius:9px;padding:12px;line-height:1;font-size:17px;transition:.2s}.iconbtn:hover,.iconbtn.active{background:#d3b56b33;border-color:#d3b56b99;color:#ffda8f}.side-note{position:absolute;left:38px;bottom:102px;pointer-events:none}.side-note .number{font-size:10px;letter-spacing:2px;color:#d1b671;border-left:2px solid #d1b671;padding-left:10px}.side-note p{font-size:12px;color:#c0c6c3;line-height:1.8;margin:11px 0 0}.legend{display:flex;gap:16px;margin-top:11px;font-size:9px;color:#a9b4b2;letter-spacing:.5px}.legend i{display:inline-block;width:5px;height:5px;background:#d8b46a;border-radius:50%;margin-right:6px}.legend i.blue{background:#77adbb}.legend i.green{background:#93b79a}.toolbar{position:absolute;right:34px;bottom:95px;width:185px;padding:15px 16px}.toolbar-title{font-size:9px;letter-spacing:2px;color:#b8bdb8;margin-bottom:10px}.control{display:flex;width:100%;align-items:center;justify-content:space-between;border:0;background:transparent;color:#e4e3da;padding:10px 0;cursor:pointer;text-align:left;font-size:11px;border-bottom:1px solid #ffffff10}.control:last-child{border:0}.control span:last-child{color:#dfc381;font-size:10px;font-variant-numeric:tabular-nums}.control:hover{color:#ffce6c}.footer{position:absolute;left:38px;right:34px;bottom:24px;display:flex;align-items:center;justify-content:space-between;border-top:1px solid #ffffff1b;padding-top:16px;font-size:10px;color:#aeb8b7;letter-spacing:.7px}.hints{display:flex;gap:22px;align-items:center}.key{border:1px solid #ffffff28;padding:3px 6px;border-radius:4px;margin-right:5px;color:#d6dad3;font-size:9px}.live{display:flex;align-items:center;gap:8px;font-size:9px;letter-spacing:1.5px}.dot{width:5px;height:5px;background:#9bbc90;box-shadow:0 0 8px #9bbc9070;border-radius:50%}#fps{margin-left:12px;font-size:10px;letter-spacing:.5px;color:#8f9a98}#toast{position:absolute;left:50%;top:24px;transform:translate(-50%,-15px);background:#1e272bed;border:1px solid #bba66b6b;color:#ecdba8;font-size:12px;padding:12px 22px;border-radius:7px;opacity:0;pointer-events:none;transition:.3s}#toast.show{opacity:1;transform:translate(-50%,0)}#tooltip{position:absolute;display:none;pointer-events:none;background:#eee7d7eb;border:1px solid #fff7;color:#333c3e;padding:9px 13px;border-radius:6px;font-size:11px;box-shadow:0 4px 16px #0003}#loading{position:absolute;inset:0;background:#252a2c;display:grid;place-items:center;z-index:20;transition:opacity .6s}.loading-inner{text-align:center}.loading-inner h2{font-weight:400;letter-spacing:8px;font-size:26px}.loading-inner p{font-size:11px;letter-spacing:2px;color:#b9b3a3}.loading-line{width:200px;height:1px;background:#ffffff20;margin:25px auto;overflow:hidden}.loading-line:after{content:"";display:block;width:90px;height:1px;background:#dac181;animation:load 1.2s infinite}@keyframes load{from{transform:translateX(-90px)}to{transform:translateX(200px)}}body.clean header,body.clean .topright,body.clean .side-note,body.clean .toolbar,body.clean .footer{display:none}#error{display:none;position:absolute;inset:25%;background:#282c2e;padding:30px;border:1px solid #b89b67;z-index:30;line-height:1.8}.small{font-size:10px;color:#aab5b2}@media(max-width:800px){header{left:20px;top:22px}h1{font-size:25px}.subtitle{font-size:9px}.eyebrow{font-size:8px}.topright{right:16px;top:20px}.clock{padding:8px 10px}.iconbtn{padding:10px}.side-note{display:none}.toolbar{right:16px;width:157px;bottom:86px;padding:9px 12px}.footer{left:20px;right:16px;bottom:17px}.hints{gap:8px}.live{display:none}.hints span{font-size:9px}}@media(max-width:500px){.topright{top:122px}.toolbar{bottom:80px}.footer .hints{flex-wrap:wrap;row-gap:9px}.subtitle{letter-spacing:1px}}
</style>

<body>
<canvas id="scene" tabindex="0" aria-label="可拖拽旋转的三维体素建筑工地沙盘"></canvas><div class="vignette"></div>
<header><div class="eyebrow"><i class="mark"></i> ATELIER / MINIATURE WORLDS</div><h1>筑造之间</h1><div class="subtitle">一方沙盘，一座正在生长的城市。</div></header>
<div class="topright"><div class="clock glass"><span class="sunicon" id="weatherIcon">☀</span><div><div id="time">16:20</div><div class="phase" id="phase">午后 · 晴朗</div></div></div><button class="iconbtn" id="rainButton" title="切换暴雨 [空格]" aria-label="切换暴雨">☂</button><button class="iconbtn" id="homeButton" title="恢复观察视角 [R]" aria-label="恢复观察视角">⌂</button></div>
<div class="side-note"><div class="number">NO. 001 / 建设进行时</div><p>从一铲泥土，到城市天际线。<br>停下来，看见每一份忙碌。</p><div class="legend"><span><i></i>土方作业</span><span><i class="blue"></i>结构施工</span><span><i class="green"></i>后勤调度</span></div></div>
<div class="toolbar glass"><div class="toolbar-title">SANDBOX CONTROLS</div><button class="control" id="speedButton" title="亦可点击桌上 SPEED 实体旋钮"><span>设备运行</span><span id="speedValue">1.0 ×</span></button><button class="control" id="dayButton" title="亦可点击桌上 DAY / NIGHT 实体旋钮"><span>昼夜循环</span><span id="dayValue">开启 ↻</span></button><button class="control" id="dustButton" title="亦可点击桌上 DUST 实体旋钮"><span>施工扬尘</span><span id="dustValue">轻盈</span></button><button class="control" id="orbitButton"><span>闲置环绕</span><span id="orbitValue">开启 ↻</span></button></div>
<footer class="footer"><div class="hints"><span><b class="key">拖拽</b>环视</span><span><b class="key">滚轮</b>缩放</span><span><b class="key">SPACE</b>暴雨</span><span><b class="key">H</b>沉浸</span><span class="small">桌前旋钮可直接点击</span></div><div class="live"><i class="dot"></i> LIVE DIORAMA <span id="fps">— FPS</span></div></footer>
<div id="toast" role="status" aria-live="polite"></div><div id="tooltip"></div><div id="loading"><div class="loading-inner"><div class="eyebrow" style="justify-content:center">ATELIER / 001</div><h2>正在筑造微缩世界</h2><div class="loading-line"></div><p>铺设道路 · 吊装钢筋 · 点亮工地</p></div></div><div id="error"></div>
